syntax = "proto3";

package birdy.rpc;

import "TradingOpportunity.proto";

message BinaryRPCMessage {
  int32 version = 1;
  MessageType message_type = 2;
  int32 request_id = 3;
  bytes payload = 4;
}

enum MessageType {
  REQUEST = 0;
  RESPONSE = 1;
  STREAM = 2;
}

enum StreamType {
  TRADING_OPPORTUNITIES = 1;
  PRICE_UPDATES = 2;
  ORDER_STATUS = 3;
  BALANCE_UPDATES = 4;
}

message StreamSubscription {
  StreamType stream_type = 1;
  StreamFilters filters = 2;
}

message StreamFilters {
  double min_profit_potential = 1;
  double max_slippage = 2;
  repeated string tokens = 3;
  repeated string dex_names = 4;
}

message StreamData {
  string stream_id = 1;
  StreamType stream_type = 2;
  repeated birdy.trading.TradingOpportunity opportunities = 3;
}

message ErrorResponse {
  int32 code = 1;
  string message = 2;
}
