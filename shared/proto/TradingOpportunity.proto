syntax = "proto3";

package birdy.trading;

message TradingOpportunity {
  string id = 1;
  int64 timestamp = 2;
  string token_in = 3;
  string token_out = 4;
  double current_price = 5;
  double target_price = 6;
  double profit_potential = 7;
  int32 confidence = 8;
  string metadata = 9;
  double slippage_tolerance = 10;
  string dex_name = 11;
}
